[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "band2midi"
version = "0.1.0"
description = "Extract software-instrument MIDI notes from GarageBand projects"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = ["mido>=1.3.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
band2midi = "band2midi.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

